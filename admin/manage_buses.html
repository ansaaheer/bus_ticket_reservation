<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Buses - Admin Panel</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-body">

    <nav class="navbar">
        <div class="nav-container">
            <h2 class="logo">BusTicket Admin</h2>
            <div class="nav-links">
                <a href="dashboard.html" class="nav-item">Dashboard</a>
                <a href="manage_buses.html" class="nav-item"><b>Buses</b></a>
                <button onclick="logout()" class="btn-logout">Logout</button>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="dashboard-header" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1>Bus Management</h1>
                <p>Add or remove bus routes from the system.</p>
            </div>
            <button class="btn-primary" style="width: auto; padding: 10px 20px;" onclick="toggleBusForm()">+ Add New Bus</button>
        </div>

        <div id="busFormContainer" class="table-container" style="display: none; padding: 20px; margin-bottom: 20px;">
            <h3>Add New Bus Route</h3>
            <form id="addBusForm" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
                <div class="form-group">
                    <label>Bus Number</label>
                    <input type="text" name="bus_number" required placeholder="e.g. BT-101">
                </div>
                <div class="form-group">
                    <label>Bus Name</label>
                    <input type="text" name="bus_name" required placeholder="e.g. Express Liner">
                </div>
                <div class="form-group">
                    <label>Source (From)</label>
                    <input type="text" name="source" required>
                </div>
                <div class="form-group">
                    <label>Destination (To)</label>
                    <input type="text" name="destination" required>
                </div>
                <div class="form-group">
                    <label>Departure Date & Time</label>
                    <input type="datetime-local" name="departure_time" required>
                </div>
                <div class="form-group">
                    <label>Total Seats</label>
                    <input type="number" name="total_seats" required min="1">
                </div>
                <div class="form-group">
                    <label>Fare ($)</label>
                    <input type="number" step="0.01" name="fare" required>
                </div>
                <div style="grid-column: span 2;">
                    <button type="submit" class="btn-primary">Save Bus Route</button>
                    <button type="button" onclick="toggleBusForm()" style="background: none; border: none; color: var(--danger); cursor: pointer; margin-left: 10px;">Cancel</button>
                </div>
            </form>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Number</th>
                        <th>Name</th>
                        <th>Route</th>
                        <th>Departure</th>
                        <th>Seats (Avail/Total)</th>
                        <th>Fare</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="adminBusList">
                    </tbody>
            </table>
        </div>
    </main>

    <script src="../js/auth.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        // Security check
        document.addEventListener('DOMContentLoaded', async () => {
            const auth = await checkAuth();
            if (!auth.success || auth.role !== 'admin') {
                window.location.href = '../index.html';
            } else {
                loadAdminBuses();
            }
        });

        function toggleBusForm() {
            const form = document.getElementById('busFormContainer');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }
    </script>
</body>
</html>
